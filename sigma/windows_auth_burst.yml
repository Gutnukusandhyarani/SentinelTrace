title: PowerShell Executed with Encoded Command Switch
id: da23f5d9-49fa-4639-913e-77eeab679f8c
status: experimental
description: Detects PowerShell process creation with common encoded-command switches. Encoding alone is not proof of malicious activity.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: SentinelTrace training lab
date: 2026/11/17
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith: '\powershell.exe'
  selection_encoded:
    CommandLine|contains:
      - '-EncodedCommand'
      - ' -enc '
      - 'FromBase64String'
  condition: selection_image and selection_encoded
fields:
  - User
  - Image
  - ParentImage
  - CommandLine
falsepositives:
  - Approved management automation
  - Signed deployment scripts
level: high
---
title: Scheduled Task Creation
id: 5d25da53-8958-4f85-bb8a-831f9c5a6cb5
status: experimental
description: Detects creation of a scheduled task using Windows Security event 4698. Review the task action and run-as identity.
references:

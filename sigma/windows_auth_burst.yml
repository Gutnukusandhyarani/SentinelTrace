level: medium
---
title: Process Access to LSASS
id: 1e114c15-6ff0-4a4e-b4b7-774a3502fef1
status: experimental
description: Detects Sysmon process access events where the target process is LSASS. Correlate source image, signer, and granted access.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: SentinelTrace training lab
date: 2026/11/17
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
  condition: selection
fields:
  - SourceImage
  - TargetImage
  - GrantedAccess
  - User
falsepositives:
  - Endpoint protection and approved diagnostic tools
level: high

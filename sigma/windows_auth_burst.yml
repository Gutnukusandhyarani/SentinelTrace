title: Repeated Windows Logon Failures from a Single Source
id: 3bcb2b4d-2a10-4e6f-bc6b-4fdb209b9a01
status: experimental
description: Detects a high count of failed logons from one source. Correlation and success-after-failure logic should be implemented in the SIEM.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: SentinelTrace training lab
date: 2026/11/17
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  condition: selection
fields:
  - IpAddress
  - TargetUserName
  - Computer
falsepositives:
  - Misconfigured clients
  - Shared NAT egress
  - Approved authentication testing
level: medium
